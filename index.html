<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="luna-card.svg">
<link rel="icon" href="luna-card.svg">
<title>Wallet</title>
<style>
  :root { --cw:min(calc(100vw - 24px), 420px); --ch:calc(var(--cw) / 1.586); --ease:cubic-bezier(.32,.72,0,1);
          --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; overscroll-behavior:none;
               font-family:-apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  .app { position:fixed; inset:0; overflow:hidden; overflow:clip; }

  .head { position:absolute; top:calc(var(--top) + 14px); left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 18px; transition:opacity .3s; }
  .head h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:-.5px; }
  .head .btns { display:flex; gap:10px; }
  .round { width:34px; height:34px; border-radius:50%; background:#1c1c1e; display:grid; place-items:center; color:#fff; font-size:21px; border:0; }

  .stack { position:absolute; top:calc(var(--top) + 72px); left:0; right:0; bottom:0; }
  .card { position:absolute; top:0; left:50%; margin-left:calc(var(--cw) / -2); width:var(--cw); height:var(--ch); border-radius:calc(var(--cw) * .046); overflow:hidden;
          will-change:transform; backface-visibility:hidden; transform-origin:50% 0;
          transition:transform .62s var(--ease); box-shadow:0 -1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.5); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .card .shine { position:absolute; top:-50%; left:0; width:38%; height:200%; pointer-events:none; mix-blend-mode:soft-light;
                 background:linear-gradient(90deg, transparent, rgba(255,255,255,.9) 50%, transparent);
                 will-change:transform, opacity; transform:translate3d(-140%,0,0) rotate(20deg);
                 animation:sweep 7s cubic-bezier(.45,0,.25,1) infinite; transition:opacity .35s ease; }
  .card .shine.follow { animation:none; }
  @keyframes sweep { 0%,55% { transform:translate3d(-140%,0,0) rotate(20deg); } 100% { transform:translate3d(300%,0,0) rotate(20deg); } }

  .cash { background:#1c1c1e; padding:14px 16px; }
  .cash .n, .cash .v { font-size:16px; font-weight:600; } .cash .v { position:absolute; top:14px; right:16px; }
  .cash .dots { position:absolute; bottom:-30px; right:-20px; width:170px; height:170px; border-radius:50%; background:radial-gradient(circle, #3a3a3c 1.5px, transparent 2px) 0 0/10px 10px; opacity:.8; }
  .ticket { background:#f4f1ea; color:#1c1c1e; padding:14px 16px; }
  .ticket .n { font-size:16px; font-weight:600; } .ticket .v { position:absolute; top:15px; right:16px; font-size:13px; color:#6e6e73; }
  .ticket .strip { position:absolute; left:0; right:0; top:50px; height:6px; background:#d62d2d; }
  .ticket .qr { position:absolute; right:16px; bottom:16px; width:68px; height:68px; background:
      conic-gradient(#1c1c1e 25%, transparent 0 50%, #1c1c1e 0 75%, transparent 0) 0 0/17px 17px; border:5px solid #fff; outline:1px solid #ddd; }

  .detail { position:absolute; top:calc(var(--ch) + 20px); left:50%; width:var(--cw); margin-left:calc(var(--cw) / -2);
            opacity:0; transform:translate3d(0,24px,0); will-change:transform, opacity; pointer-events:none;
            transition:opacity .25s ease, transform .5s var(--ease); }
  .stack.sel .detail { opacity:1; transform:none; pointer-events:auto; transition-delay:.12s; }
  .stack.sel ~ .head { opacity:0; pointer-events:none; }
  .meta { display:flex; justify-content:space-between; align-items:baseline; padding:2px 4px 14px; }
  .meta .bal { font-size:28px; font-weight:700; } .meta small { color:#8e8e93; font-size:13px; display:block; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .actions button { background:#1c1c1e; color:#fff; border:0; border-radius:14px; padding:14px; font:600 16px/1 inherit; font-family:inherit; transition:transform .15s; }
  .actions button:active { transform:scale(.96); }
  .actions button.pay { background:#fff; color:#000; }
  .txh { font-size:20px; font-weight:700; padding:0 4px 8px; }
  .tx { background:#1c1c1e; border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 14px; font-size:15px; }
  .row + .row { border-top:.5px solid #2c2c2e; }
  .ico { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font-size:17px; flex:none; }
  .row .w { flex:1; min-width:0; } .row .w small { display:block; color:#8e8e93; font-size:13px; }
  .row .amt { font-weight:500; }

  .pay-layer { position:absolute; inset:0; background:#000; z-index:25; display:flex; flex-direction:column; align-items:center; padding-top:calc(var(--top) + 40px);
               opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  .pay-layer.on { opacity:1; visibility:visible; transition:opacity .35s var(--ease); }
  .pay-layer .pc { width:var(--cw); height:var(--ch); border-radius:calc(var(--cw) * .046); overflow:hidden; will-change:transform;
                   transform:translate3d(0,40px,0) scale(.94); transition:transform .7s var(--ease); box-shadow:0 12px 34px rgba(0,0,0,.7); }
  .pay-layer.on .pc { transform:none; }
  .pay-layer.done .pc { animation:thud .45s var(--ease); }
  .pay-layer .pc img { width:100%; height:100%; object-fit:cover; display:block; }
  .face { margin-top:16vh; width:80px; height:80px; opacity:0; transform:scale(.85); will-change:transform, opacity;
          transition:opacity .35s ease .15s, transform .6s var(--ease) .15s; }
  .pay-layer.on .face { opacity:1; transform:none; }
  .face svg { width:80px; height:80px; overflow:visible; fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
  .face g, .face path, .face circle { transform-origin:32px 32px; }
  .fid { stroke:#fff; transition:opacity .25s ease, transform .5s var(--ease); }
  .fid-feat { transition:opacity .2s ease, transform .4s var(--ease); }
  .pay-layer.scan .fid { animation:breathe 1.3s ease-in-out infinite; }
  .pay-layer.scan .fid-feat { animation:look 1.3s ease-in-out infinite; }
  .pay-layer.done .fid { opacity:0; transform:scale(.55) rotate(45deg); }
  .pay-layer.done .fid-feat { opacity:0; transform:scale(.6); }
  .ok { stroke:#30d158; }
  .ok circle, .ok path { stroke-dasharray:1; stroke-dashoffset:1; }
  .ok circle { transform:rotate(-90deg); }
  .pay-layer.done .ok circle { stroke-dashoffset:0; transition:stroke-dashoffset .55s cubic-bezier(.65,0,.35,1) .1s; }
  .pay-layer.done .ok path { stroke-dashoffset:0; transition:stroke-dashoffset .35s cubic-bezier(.65,0,.35,1) .5s; }
  .pay-txt { margin-top:22px; height:22px; width:240px; position:relative; font-size:17px; font-weight:500; color:#f2f2f7; }
  .pay-txt span { position:absolute; inset:0; text-align:center; transition:opacity .3s ease, transform .45s var(--ease); }
  .pay-txt .t2 { opacity:0; transform:translate3d(0,8px,0); }
  .pay-layer.done .pay-txt .t1 { opacity:0; transform:translate3d(0,-8px,0); }
  .pay-layer.done .pay-txt .t2 { opacity:1; transform:none; transition-delay:.35s; }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(.93); } }
  @keyframes look { 0%,100% { transform:none; } 25% { transform:translate3d(-2.5px,0,0); } 75% { transform:translate3d(2.5px,0,0); } }
  @keyframes thud { 40% { transform:scale(1.025); } 100% { transform:none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stack" id="stack">
    <div class="card cash"><div class="dots"></div><span class="n">Cash</span><span class="v">124,50 €</span></div>
    <div class="card ticket"><span class="n">Deutschlandticket</span><span class="v">Okt 2026</span><div class="strip"></div><div class="qr"></div></div>
    <div class="card luna"><img src="luna-card.svg" alt="Luna Platin Karte"><div class="shine"></div></div>
    <div class="detail">
      <div class="meta">
        <div><small>Luna Platin •••• 1967</small><span class="bal">148.920,00 €</span></div>
        <small style="text-align:right">Verfügbar<br>Kein Limit</small>
      </div>
      <div class="actions">
        <button class="pay" id="payBtn">Bezahlen</button>
        <button id="backBtn">Fertig</button>
      </div>
      <div class="txh">Letzte Transaktionen</div>
      <div class="tx">
        <div class="row"><span class="ico" style="background:#b8860b;font-weight:700">P</span><span class="w">Porsche Zentrum<small>Heute · 911 GT3</small></span><span class="amt">25.000,00 €</span></div>
        <div class="row"><span class="ico" style="background:#30d158">↗</span><span class="w">NVIDIA Aktien<small>Gestern · 120 Stück</small></span><span class="amt">16.380,00 €</span></div>
        <div class="row"><span class="ico" style="background:#0a84ff">↗</span><span class="w">Porsche Aktien<small>Montag · 300 Stück</small></span><span class="amt">13.950,00 €</span></div>
      </div>
    </div>
  </div>
  <div class="head">
    <h1>Wallet</h1>
    <div class="btns"><button class="round" aria-label="Hinzufügen">+</button><button class="round" aria-label="Mehr">⋯</button></div>
  </div>
  <div class="pay-layer" id="pay">
    <div class="pc"><img src="luna-card.svg" alt=""></div>
    <div class="face">
      <svg viewBox="0 0 64 64">
        <g class="fid">
          <path d="M4 18V12a8 8 0 0 1 8-8h6M46 4h6a8 8 0 0 1 8 8v6M60 46v6a8 8 0 0 1-8 8h-6M18 60h-6a8 8 0 0 1-8-8v-6"/>
          <g class="fid-feat"><path d="M22 23v5M42 23v5M32 23v12.5c0 1.2-.8 1.8-2.2 1.8"/><path d="M23 44c5.5 4.5 12.5 4.5 18 0"/></g>
        </g>
        <g class="ok">
          <circle cx="32" cy="32" r="28" pathLength="1"/>
          <path d="M20.5 32.5l7.8 7.8 15.5-16.3" pathLength="1"/>
        </g>
      </svg>
    </div>
    <div class="pay-txt"><span class="t1">Face ID</span><span class="t2">Fertig</span></div>
  </div>
</div>

<script>
  const stack = document.getElementById('stack');
  const cards = [...stack.querySelectorAll('.card')];
  const pay = document.getElementById('pay');
  let selected = null;

  function layout() {
    const h = cards[0].offsetHeight;
    const peek = Math.round(h * 0.32);
    const bottom = stack.clientHeight - 64;
    cards.forEach((c, i) => {
      let y, s = 1, z = i + 1, delay = 0;
      if (selected === null) {
        y = i * peek;
        delay = (cards.length - 1 - i) * 35;
      } else if (c === selected) {
        y = 0; z = 10;
      } else {
        const rest = cards.filter(x => x !== selected).indexOf(c);
        y = bottom + rest * 10;
        s = 0.92 + rest * 0.02;
        delay = rest * 35;
      }
      c.style.zIndex = z;
      c.style.transitionDelay = delay + 'ms';
      c.style.transform = 'translate3d(0,' + y + 'px,0) scale(' + s + ')';
    });
    stack.classList.toggle('sel', selected !== null);
  }

  cards.forEach(c => c.addEventListener('click', () => { selected = (selected === c) ? null : c; layout(); }));
  document.getElementById('backBtn').onclick = () => { selected = null; layout(); };
  addEventListener('resize', layout);

  // Schimmer folgt dem Finger, weich nachgezogen
  stack.querySelectorAll('.shine').forEach(sh => {
    const card = sh.parentElement;
    let target = 0, cur = 0, raf = 0, out = 0;
    const pos = e => e.clientX - card.getBoundingClientRect().left - sh.offsetWidth / 2;
    const tick = () => {
      cur += (target - cur) * 0.15;
      sh.style.transform = 'translate3d(' + cur.toFixed(1) + 'px,0,0) rotate(20deg)';
      raf = Math.abs(target - cur) > 0.3 ? requestAnimationFrame(tick) : 0;
    };
    card.addEventListener('pointerdown', e => {
      clearTimeout(out);
      cur = target = pos(e);
      sh.classList.add('follow');
      sh.style.opacity = 1;
      tick();
    });
    card.addEventListener('pointermove', e => {
      if (!sh.classList.contains('follow')) return;
      target = pos(e);
      if (!raf) raf = requestAnimationFrame(tick);
    });
    const leave = () => {
      sh.style.opacity = 0;
      out = setTimeout(() => { cancelAnimationFrame(raf); raf = 0; sh.classList.remove('follow'); sh.style.transform = ''; sh.style.opacity = ''; }, 350);
    };
    card.addEventListener('pointerup', leave);
    card.addEventListener('pointercancel', leave);
  });

  // Face ID: einblenden → scannen → Haken → ausblenden
  let timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  function closePay() { timers.forEach(clearTimeout); timers = []; pay.className = 'pay-layer'; }
  function startPay() {
    closePay();
    void pay.offsetWidth;
    pay.className = 'pay-layer on';
    later(450, () => pay.className = 'pay-layer on scan');
    later(1750, () => pay.className = 'pay-layer on done');
    later(3700, closePay);
  }
  document.getElementById('payBtn').onclick = startPay;
  pay.onclick = closePay;

  // erster Aufbau ohne Animation, danach weich
  cards.forEach(c => c.style.transition = 'none');
  layout();
  void stack.offsetWidth;
  cards.forEach(c => c.style.transition = '');

  // App-Icon für den Home-Bildschirm: Bulldogge aus der Karte ausschneiden
  const src = new Image();
  src.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 180;
    const s = src.naturalHeight * 0.66, cx = src.naturalWidth * 0.549, cy = src.naturalHeight * 0.485;
    cv.getContext('2d').drawImage(src, cx - s / 2, cy - s / 2, s, s, 0, 0, 180, 180);
    const url = cv.toDataURL('image/png');
    document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]').forEach(l => l.href = url);
  };
  src.src = 'luna-card.svg';
</script>
</body>
</html>
