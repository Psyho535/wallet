<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="luna-card.svg">
<link rel="icon" href="luna-card.svg">
<title>Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --cw:min(calc(100vw - 32px), 420px); --ch:calc(var(--cw) / 1.586); --r:calc(var(--cw) * .046);
          --ease:cubic-bezier(.32,.72,0,1); --glide:cubic-bezier(.22,1,.36,1);
          --gold:#c9a96e; --gold-dim:rgba(201,169,110,.55); --line:rgba(255,255,255,.07); --panel:#111113; --muted:#8a8a90;
          --serif:"Cormorant Garamond", "Times New Roman", serif;
          --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; color:#f4f2ee; overflow:hidden; overscroll-behavior:none;
               background:radial-gradient(120% 70% at 50% -10%, #1a1814 0%, #0a0a0b 45%, #000 100%) #000;
               font-family:-apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing:antialiased;
               -webkit-user-select:none; user-select:none; touch-action:manipulation; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  .app { position:fixed; inset:0; overflow:hidden; overflow:clip; }

  .head { position:absolute; top:calc(var(--top) + 12px); left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end;
          padding:0 22px; transition:opacity .45s var(--glide), transform .6s var(--glide); z-index:1; }
  .head .date { display:block; font-size:11px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:2px; }
  .head h1 { margin:0; font-family:var(--serif); font-size:40px; font-weight:500; letter-spacing:.3px; line-height:1; }
  .head .btns { display:flex; gap:10px; padding-bottom:4px; }
  .round { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.04); border:1px solid rgba(201,169,110,.28);
           display:grid; place-items:center; color:var(--gold); font-size:20px; font-weight:300; transition:transform .2s var(--glide), background .2s; }
  .round:active { transform:scale(.9); background:rgba(201,169,110,.12); }

  .stack { position:absolute; top:calc(var(--top) + 96px); left:0; right:0; bottom:0; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .stack::-webkit-scrollbar { display:none; }
  .stack.sel { overflow:hidden; }
  .spacer { position:absolute; top:0; left:0; width:1px; pointer-events:none; }
  .sec { position:absolute; left:calc(50% - var(--cw) / 2 + 4px); top:0; font-size:11px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold-dim);
         transition:opacity .4s var(--glide); }
  .stack.sel .sec { opacity:0; }

  .card { position:absolute; top:0; left:50%; margin-left:calc(var(--cw) / -2); width:var(--cw); height:var(--ch); border-radius:var(--r); overflow:hidden;
          will-change:transform; backface-visibility:hidden; transform-origin:50% 0;
          transition:transform .75s var(--glide), opacity .45s var(--glide);
          box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14), 0 -1px 0 rgba(255,255,255,.06), 0 18px 40px -12px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.45); }
  .card.leaving, .card.dim { opacity:0; pointer-events:none; }
  .face-img { background:#1c1c1e; }
  .face-img img { width:100%; height:100%; object-fit:fill; display:block; pointer-events:none; }
  .face-img img.rot { position:absolute; left:50%; top:50%; width:var(--ch); height:var(--cw); transform:translate(-50%,-50%) rotate(-90deg); }
  .shine { position:absolute; top:-50%; left:0; width:38%; height:200%; pointer-events:none; mix-blend-mode:soft-light;
           background:linear-gradient(90deg, transparent, rgba(255,255,255,.85) 50%, transparent);
           will-change:transform, opacity; transform:translate3d(-140%,0,0) rotate(20deg);
           animation:sweep 9s cubic-bezier(.45,0,.25,1) infinite; transition:opacity .4s ease; }
  .shine.follow { animation:none; }
  @keyframes sweep { 0%,62% { transform:translate3d(-140%,0,0) rotate(20deg); } 100% { transform:translate3d(300%,0,0) rotate(20deg); } }

  /* Cash: helle Perlmutt-Karte mit Regenbogen-Punktfeld, das sich beim Neigen/Wischen bewegt */
  .face-cash { background:linear-gradient(160deg, #fbfbfd, #eceef2 60%, #f6f6f9); color:#1c1c1e; padding:16px 18px; }
  .face-cash .n { position:relative; font-size:20px; font-weight:600; letter-spacing:-.2px; }
  .face-cash .v { position:absolute; top:18px; right:18px; font-size:16px; font-weight:500; }
  .holo, .holo .dots, .sheen { position:absolute; inset:0; pointer-events:none; }
  .holo { -webkit-mask-image:radial-gradient(ellipse 85% 95% at 72% 62%, #000 25%, transparent 72%); mask-image:radial-gradient(ellipse 85% 95% at 72% 62%, #000 25%, transparent 72%); }
  .holo .dots { -webkit-mask-image:radial-gradient(circle, #000 1.9px, transparent 2.5px); -webkit-mask-size:9px 9px;
                mask-image:radial-gradient(circle, #000 1.9px, transparent 2.5px); mask-size:9px 9px; }
  .move { position:absolute; inset:-60%; will-change:transform; transform:translate3d(var(--hx, 0px), var(--hy, 0px), 0); transition:transform .5s var(--glide); }
  .spin { position:absolute; inset:0; will-change:transform; animation:spin 12s linear infinite;
          background:conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #5ac8fa, #007aff, #af52de, #ff2d55, #ff3b30); }
  .sheen { overflow:hidden; mix-blend-mode:soft-light; opacity:.55; }
  .sheen .move { background:linear-gradient(115deg, transparent 35%, #ff9ad5 42%, #ffe58a 47%, #9cf5c4 52%, #8ec5ff 57%, #c79bff 62%, transparent 70%); }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Bordkarten – Bulldog Airways ist eine erfundene Fluggesellschaft.
     Das Ticket ist immer voll lang und wird nur per clip-path auf- und zugeklappt: flüssig, ohne Neuberechnung des Layouts */
  .card.face-pass { height:auto; background:var(--pc); color:#fff; padding:18px 20px 22px;
                    clip-path:inset(0 0 calc(100% - var(--ch)) 0 round var(--r)); -webkit-clip-path:inset(0 0 calc(100% - var(--ch)) 0 round var(--r));
                    transition:transform .75s var(--glide), opacity .45s var(--glide), clip-path .7s var(--glide), -webkit-clip-path .7s var(--glide); }
  .card.face-pass.open { clip-path:inset(0 0 0 0 round var(--r)); -webkit-clip-path:inset(0 0 0 0 round var(--r)); }
  .face-pass::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, transparent, var(--pg), transparent); }
  .pass-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .air { display:flex; align-items:center; gap:10px; font-size:11px; font-weight:600; letter-spacing:2.6px; color:var(--pg); padding-top:3px; }
  .air i { width:28px; height:28px; border-radius:50%; border:1px solid var(--pg); display:grid; place-items:center; font-style:normal; font-size:13px; }
  .kv small { display:block; font-size:9px; letter-spacing:1.6px; color:rgba(255,255,255,.55); text-transform:uppercase; margin-bottom:3px; }
  .kv b { font-size:15px; font-weight:500; white-space:nowrap; } .pass-top .kv { text-align:right; }
  .route { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .route .ap b { display:block; font-family:var(--serif); font-size:44px; font-weight:500; letter-spacing:1.5px; line-height:1; }
  .route .ap small { font-size:11px; letter-spacing:.3px; color:rgba(255,255,255,.65); }
  .route .ap:last-child { text-align:right; }
  .plane { flex:1; margin:0 12px 16px; height:1px; position:relative; background:linear-gradient(90deg, transparent, var(--pg) 20%, var(--pg) 80%, transparent); opacity:.8; }
  .plane::after { content:"✈"; position:absolute; left:50%; top:50%; transform:translate(-50%,-55%); color:var(--pg); font-size:15px; background:var(--pc); padding:0 8px; }
  .pass-bot { margin-top:calc(var(--ch) - 176px); display:grid; grid-template-columns:1.25fr .9fr .55fr .9fr; gap:8px; }
  .pass-bot b { font-size:13px; }
  .pass-more { margin-top:26px; padding-top:20px; border-top:1px dashed rgba(255,255,255,.22); position:relative; }
  .pass-more::before, .pass-more::after { content:""; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%; background:#000; }
  .pass-more::before { left:-31px; } .pass-more::after { right:-31px; }
  .pass-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px 10px; }
  .pass-grid b { font-size:13px; }
  .pass-qr { width:min(168px, 46vw); margin:26px auto 0; background:#fff; border-radius:14px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .pass-qr svg { width:100%; height:auto; display:block; }
  .pass-cap { text-align:center; font-size:10px; letter-spacing:2px; color:rgba(255,255,255,.6); margin-top:12px; }

  /* Detailansicht */
  .detail { position:absolute; top:0; left:50%; width:var(--cw); margin-left:calc(var(--cw) / -2); overflow-y:auto;
            padding:4px 0 calc(var(--bottom) + 120px); -webkit-overflow-scrolling:touch; scrollbar-width:none;
            opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .detail::-webkit-scrollbar { display:none; }
  .stack.sel .detail { opacity:1; pointer-events:auto; transition:opacity .4s ease .1s; }
  .stack.sel ~ .head { opacity:0; transform:translate3d(0,-8px,0); pointer-events:none; }
  .rise { opacity:0; transform:translate3d(0,14px,0); }
  .stack.sel .rise { animation:rise .8s var(--glide) both; animation-delay:calc(140ms + var(--i, 0) * 45ms); }
  @keyframes rise { to { opacity:1; transform:none; } }

  .meta { display:flex; justify-content:space-between; align-items:flex-end; padding:6px 2px 22px; gap:14px; }
  .label { display:block; font-size:10.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
  .meta .bal { display:block; font-family:var(--serif); font-size:40px; font-weight:500; letter-spacing:.2px; line-height:1; }
  .meta .side { text-align:right; font-size:12px; color:var(--muted); line-height:1.6; }
  .meta .side b { display:block; color:#e8e4dc; font-weight:500; font-size:13px; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:30px; }
  .actions button { height:52px; border-radius:26px; font-size:15px; font-weight:500; letter-spacing:.3px; color:#f4f2ee;
                    background:transparent; border:1px solid rgba(255,255,255,.16); transition:transform .25s var(--glide), background .25s; }
  .actions button:active { transform:scale(.97); background:rgba(255,255,255,.06); }
  .actions button.primary { background:linear-gradient(180deg, #f6f3ec, #e4ddcf); color:#141210; border:0; box-shadow:0 6px 18px rgba(201,169,110,.18); }
  .txh { display:flex; justify-content:space-between; align-items:baseline; padding:0 2px 12px; }
  .txh h3 { margin:0; font-family:var(--serif); font-size:24px; font-weight:500; letter-spacing:.2px; }
  .sum { display:grid; grid-template-columns:1fr 1fr; background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-bottom:14px; }
  .sum div { padding:16px 18px; } .sum div + div { border-left:1px solid var(--line); text-align:right; }
  .sum b { display:block; font-size:17px; font-weight:500; margin-top:2px; } .sum .in { color:#9fd8a9; }
  .tx { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; padding:15px 18px; font-size:15px; }
  .row + .row { border-top:1px solid var(--line); }
  .ico { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:500; flex:none;
         color:var(--gold); background:radial-gradient(circle at 30% 25%, #26231e, #121110); border:1px solid rgba(201,169,110,.3); }
  .row .w { flex:1; min-width:0; } .row .w small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .row .w span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .row .amt { font-weight:500; white-space:nowrap; } .row .amt.in { color:#9fd8a9; }
  .remove { display:block; width:100%; height:52px; margin-top:22px; background:transparent; color:#ff6961; border:1px solid rgba(255,105,97,.3); border-radius:26px; font-size:15px; }

  .pay-layer { position:absolute; inset:0; background:radial-gradient(120% 70% at 50% 0%, #15130f, #000 60%); z-index:25; display:flex; flex-direction:column; align-items:center; padding-top:calc(var(--top) + 48px);
               opacity:0; visibility:hidden; transition:opacity .45s var(--glide), visibility 0s .45s; }
  .pay-layer.on { opacity:1; visibility:visible; transition:opacity .4s var(--glide); }
  .pay-layer .pc { position:relative; width:var(--cw); height:var(--ch); border-radius:var(--r); overflow:hidden; will-change:transform;
                   transform:translate3d(0,40px,0) scale(.94); transition:transform .8s var(--glide); box-shadow:0 24px 60px -10px rgba(0,0,0,.9), inset 0 0 0 .5px rgba(255,255,255,.14); }
  .pay-layer.on .pc { transform:none; }
  .pay-layer.on.done .pc { animation:thud .5s var(--glide); }
  .face { margin-top:16vh; width:80px; height:80px; opacity:0; transform:scale(.85); will-change:transform, opacity;
          transition:opacity .4s ease .15s, transform .7s var(--glide) .15s; }
  .pay-layer.on .face { opacity:1; transform:none; }
  .face svg { width:80px; height:80px; overflow:visible; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .face g, .face path, .face circle { transform-origin:32px 32px; }
  .fid { stroke:#f4f2ee; transition:opacity .25s ease, transform .55s var(--glide); }
  .fid-feat { transition:opacity .2s ease, transform .45s var(--glide); }
  .pay-layer.scan .fid { animation:breathe 1.3s ease-in-out infinite; }
  .pay-layer.scan .fid-feat { animation:look 1.3s ease-in-out infinite; }
  .pay-layer.done .fid { opacity:0; transform:scale(.55) rotate(45deg); }
  .pay-layer.done .fid-feat { opacity:0; transform:scale(.6); }
  /* Haken komplett unsichtbar, bis er gezeichnet wird – sonst bleibt durch die runden Linienenden ein grüner Punkt stehen */
  .ok { stroke:#30d158; opacity:0; }
  .pay-layer.done .ok { opacity:1; }
  .ok circle, .ok path { stroke-dasharray:1 2; stroke-dashoffset:1; }
  .ok circle { transform:rotate(-90deg); }
  .pay-layer.done .ok circle { stroke-dashoffset:0; transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1) .1s; }
  .pay-layer.done .ok path { stroke-dashoffset:0; transition:stroke-dashoffset .4s cubic-bezier(.65,0,.35,1) .55s; }
  .pay-txt { margin-top:24px; height:24px; width:240px; position:relative; font-family:var(--serif); font-size:22px; font-weight:500; color:#f4f2ee; }
  .pay-txt span { position:absolute; inset:0; text-align:center; transition:opacity .35s ease, transform .5s var(--glide); }
  .pay-txt .t2 { opacity:0; transform:translate3d(0,8px,0); }
  .pay-layer.done .pay-txt .t1 { opacity:0; transform:translate3d(0,-8px,0); }
  .pay-layer.done .pay-txt .t2 { opacity:1; transform:none; transition-delay:.4s; }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(.93); } }
  @keyframes look { 0%,100% { transform:none; } 25% { transform:translate3d(-2.5px,0,0); } 75% { transform:translate3d(2.5px,0,0); } }
  @keyframes thud { 40% { transform:scale(1.02); } 100% { transform:none; } }

  .sheet-bg { position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:30; opacity:0; visibility:hidden; transition:opacity .4s ease, visibility 0s .4s; }
  .sheet-bg.on { opacity:1; visibility:visible; transition:opacity .4s ease; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:31; background:#121113; border-top:1px solid rgba(201,169,110,.2); border-radius:26px 26px 0 0; padding:12px 20px calc(var(--bottom) + 24px);
           transform:translate3d(0,105%,0); transition:transform .6s var(--glide); }
  .sheet.on { transform:none; }
  .grab { width:38px; height:4px; border-radius:2px; background:#3a3a3c; margin:0 auto 16px; }
  .sheet h2 { margin:0 0 18px; font-family:var(--serif); font-size:26px; font-weight:500; text-align:center; }
  .pick { width:var(--cw); max-width:100%; aspect-ratio:1.586; margin:0 auto 16px; border-radius:var(--r); border:1px dashed rgba(201,169,110,.45);
          background:#1a1918 center/cover no-repeat; color:var(--gold-dim); font-size:13px; letter-spacing:1.6px; text-transform:uppercase; display:grid; place-items:center; text-align:center; }
  .pick.has { border-style:solid; border-color:transparent; color:transparent; }
  .sheet input[type=text] { width:100%; height:50px; background:#1c1b1d; border:1px solid var(--line); border-radius:14px; color:#f4f2ee; font-size:16px; padding:0 16px; outline:none; -webkit-user-select:text; user-select:text; }
  .sheet input[type=text]:focus { border-color:rgba(201,169,110,.45); }
  .sheet input[type=text]::placeholder { color:#5a5a5e; }
  .err { color:#ff6961; font-size:13px; min-height:20px; padding:8px 4px 0; }
  .sheet .actions { margin:6px 0 0; }
</style>
</head>
<body>
<div class="app">
  <div class="stack" id="stack">
    <div class="spacer" id="spacer"></div>
    <div class="sec" id="secPass">Bordkarten</div>
    <div class="detail" id="detail"></div>
  </div>
  <div class="head">
    <div><span class="date" id="today"></span><h1>Wallet</h1></div>
    <div class="btns"><button class="round" id="addBtn" aria-label="Karte hinzufügen">+</button><button class="round" aria-label="Mehr">⋯</button></div>
  </div>

  <div class="pay-layer" id="pay">
    <div class="pc" id="payCard"></div>
    <div class="face">
      <svg viewBox="0 0 64 64">
        <g class="fid">
          <path d="M4 18V12a8 8 0 0 1 8-8h6M46 4h6a8 8 0 0 1 8 8v6M60 46v6a8 8 0 0 1-8 8h-6M18 60h-6a8 8 0 0 1-8-8v-6"/>
          <g class="fid-feat"><path d="M22 23v5M42 23v5M32 23v12.5c0 1.2-.8 1.8-2.2 1.8"/><path d="M23 44c5.5 4.5 12.5 4.5 18 0"/></g>
        </g>
        <g class="ok">
          <circle cx="32" cy="32" r="28" pathLength="1"/>
          <path d="M20.5 32.5l7.8 7.8 15.5-16.3" pathLength="1"/>
        </g>
      </svg>
    </div>
    <div class="pay-txt"><span class="t1">Face ID</span><span class="t2">Fertig</span></div>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2>Karte hinzufügen</h2>
    <label class="pick" id="pick">Bild auswählen<input type="file" accept="image/*" id="file" hidden></label>
    <input type="text" id="cardName" placeholder="Meine Karte" maxlength="28">
    <div class="err" id="err"></div>
    <div class="actions">
      <button id="cancelAdd">Abbrechen</button>
      <button class="primary" id="confirmAdd">Hinzufügen</button>
    </div>
  </div>
</div>

<script>
  const eur = n => (n < 0 ? '−' : '+') + Math.abs(n).toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  const money = n => n.toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  // Fest eingebaute Karten, jede mit eigenen Buchungen
  const BUILTIN = [
    { id:'cash', type:'cash', name:'Cash', balance:124.5, label:'Cash-Guthaben', side:['Karte', '•••• 2201'], action:'Senden', tx:[
      { i:'L', c:'#ff9f0a', t:'Von Lena', s:'Heute · Pizza', a:18 },
      { i:'J', c:'#5e5ce6', t:'An Jonas', s:'Gestern · Kino', a:-12.5 },
      { i:'M', c:'#ff375f', t:'Von Mama', s:'Sonntag · Taschengeld', a:50 },
      { i:'T', c:'#64d2ff', t:'An Tim', s:'Freitag · Tanken', a:-20 } ] },
    { id:'express', type:'img', img:'luna-express.webp', name:'Luna Express', num:'•••• 0067', balance:52380, label:'Kontostand', side:['Mitglied seit', '1967'], action:'Bezahlen', tx:[
      { i:'✈', c:'#0a84ff', t:'Lufthansa First Class', s:'Heute · München → New York', a:-8950 },
      { i:'H', c:'#e8742b', t:'Hermès', s:'Gestern · Paris', a:-4200 },
      { i:'%', c:'#30d158', t:'Cashback', s:'Mittwoch · Prämie', a:312.4 },
      { i:'B', c:'#8e8e93', t:'Hotel Budersand', s:'Sonntag · Sylt', a:-2180 } ] },
    { id:'black', type:'img', img:'luna-black.webp', rot:true, name:'Luna Express Black', num:'•••• 0001', balance:1287450, label:'Kontostand', side:['Verfügbar', 'Unbegrenzt'], action:'Bezahlen', tx:[
      { i:'B', c:'#1c3f94', t:'Bugatti Molsheim', s:'Heute · Anzahlung', a:-250000 },
      { i:'✈', c:'#5e5ce6', t:'Privatjet', s:'Gestern · Nizza → München', a:-38000 },
      { i:'€', c:'#30d158', t:'Dividende NVIDIA', s:'Donnerstag', a:12480 },
      { i:'R', c:'#0b6e4f', t:'Rolex Boutique', s:'Montag · Daytona', a:-32900 } ] },
    { id:'luna', type:'img', img:'luna-card.svg', name:'Luna Platin', num:'•••• 1967', balance:148920, label:'Kontostand', side:['Verfügbar', 'Kein Limit'], action:'Bezahlen', tx:[
      { i:'P', c:'#b8860b', t:'Porsche Zentrum', s:'Heute · 911 GT3', a:-25000 },
      { i:'↗', c:'#30d158', t:'NVIDIA Aktien', s:'Gestern · 120 Stück', a:-16380 },
      { i:'€', c:'#30d158', t:'Dividende Porsche AG', s:'Dienstag', a:2140 },
      { i:'↗', c:'#0a84ff', t:'Porsche Aktien', s:'Montag · 300 Stück', a:-13950 } ] }
  ];

  // Zufällige, aber feste Buchungen für neue Karten
  const POOL = [
    { i:'€', c:'#30d158', t:'Gehalt', s:'Arbeitgeber', a:[2400, 4200] },
    { i:'↩', c:'#30d158', t:'Rückerstattung', s:'Online-Shop', a:[15, 90] },
    { i:'↓', c:'#30d158', t:'Überweisung von Tim', s:'Danke!', a:[10, 60] },
    { i:'R', c:'#cc0000', t:'REWE', s:'Lebensmittel', a:[-90, -12] },
    { i:'⛽', c:'#ff9f0a', t:'Shell', s:'Tanken', a:[-95, -40] },
    { i:'N', c:'#e50914', t:'Netflix', s:'Abo', a:[-17.99, -13.99] },
    { i:'Z', c:'#ff6900', t:'Zalando', s:'Kleidung', a:[-140, -30] },
    { i:'🍕', c:'#ff375f', t:'Lieferando', s:'Essen', a:[-35, -15] },
    { i:'♪', c:'#1db954', t:'Spotify', s:'Abo', a:[-12.99, -10.99] },
    { i:'DB', c:'#ec0016', t:'DB Fernverkehr', s:'Bahnticket', a:[-120, -25] },
    { i:'☕', c:'#a2845e', t:'Café Central', s:'Kaffee', a:[-8, -3] }
  ];
  const DAYS = ['Heute', 'Gestern', 'Montag', 'Sonntag', 'Samstag', 'Freitag'];
  const rnd = (a, b) => Math.round((a + Math.random() * (b - a)) * 100) / 100;
  function fakeData() {
    const picks = [...POOL].sort(() => Math.random() - .5).slice(0, 5);
    return {
      balance: rnd(300, 25000),
      num: '•••• ' + String(Math.floor(1000 + Math.random() * 9000)),
      tx: picks.map((p, k) => ({ i:p.i, c:p.c, t:p.t, s:DAYS[k] + ' · ' + p.s, a:rnd(p.a[0], p.a[1]) }))
    };
  }

  // Eigene Karten bleiben auf diesem Gerät gespeichert
  const KEY = 'wallet.customCards.v1';
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { custom = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(custom)); return true; } catch (e) { return false; } };

  // Bordkarten einer erfundenen Airline – der QR-Code ist nur ein Muster ohne Inhalt
  const PASSES = [
    { id:'f1', type:'pass', pc:'#0f1d3a', pg:'#d4af37', flight:'BDA 001', from:['MUC', 'München'], to:['JFK', 'New York'], date:'14. Nov 2026', dur:'8 Std 15 Min',
      dep:'15:40', arr:'18:55', term:'2', gate:'K12', board:'14:50', seat:'1A', cls:'First', pax:'LUNA MEMBER', bag:'3 × 32 kg', lounge:'First Lounge K' },
    { id:'f2', type:'pass', pc:'#3d0d1c', pg:'#e8c27a', flight:'BDA 077', from:['MUC', 'München'], to:['DXB', 'Dubai'], date:'2. Dez 2026', dur:'5 Std 35 Min',
      dep:'21:05', arr:'05:40 +1', term:'2', gate:'H27', board:'20:15', seat:'2K', cls:'First', pax:'LUNA MEMBER', bag:'3 × 32 kg', lounge:'First Lounge H' }
  ];

  const allCards = () => [BUILTIN[0], BUILTIN[1], BUILTIN[2], ...custom.map(c => ({ ...c, type:'img', label:'Kontostand', side:['Verfügbar', money(Math.round(c.balance * 1.6))], action:'Bezahlen', custom:true })), BUILTIN[3], ...PASSES];

  function qrSVG(seed) {
    let x = 7;
    for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
    const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
    const n = 25, inFinder = (i, j) => (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
    let cells = '';
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inFinder(i, j) && rnd() < .5) cells += '<rect x="' + i + '" y="' + j + '" width="1" height="1"/>';
    const finder = (a, b) => '<rect x="' + a + '" y="' + b + '" width="7" height="7"/><rect x="' + (a + 1) + '" y="' + (b + 1) + '" width="5" height="5" fill="#fff"/><rect x="' + (a + 2) + '" y="' + (b + 2) + '" width="3" height="3"/>';
    return '<svg viewBox="-1 -1 27 27" shape-rendering="crispEdges" fill="#1c1c1e">' + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + cells + '</svg>';
  }

  function faceHTML(c) {
    if (c.type === 'pass') return '<div class="pass-top"><span class="air"><i>✈</i>BULLDOG AIRWAYS</span><span class="kv"><small>Gate</small><b>' + esc(c.gate) + '</b></span></div>'
      + '<div class="route"><span class="ap"><b>' + c.from[0] + '</b><small>' + esc(c.from[1]) + ' · ' + c.dep + '</small></span><span class="plane"></span>'
      + '<span class="ap"><b>' + c.to[0] + '</b><small>' + esc(c.to[1]) + ' · ' + c.arr + '</small></span></div>'
      + '<div class="pass-bot"><span class="kv"><small>Passagier</small><b>' + esc(c.pax) + '</b></span><span class="kv"><small>Klasse</small><b>' + c.cls + '</b></span>'
      + '<span class="kv"><small>Sitz</small><b>' + c.seat + '</b></span><span class="kv"><small>Boarding</small><b>' + c.board + '</b></span></div>'
      + '<div class="pass-more"><div class="pass-grid">'
      + [['Flug', c.flight], ['Datum', c.date], ['Dauer', c.dur], ['Terminal', c.term], ['Gepäck', c.bag], ['Lounge', c.lounge]]
          .map(([k, v]) => '<span class="kv"><small>' + k + '</small><b>' + esc(v) + '</b></span>').join('')
      + '</div><div class="pass-qr">' + qrSVG(c.flight + c.seat) + '</div><div class="pass-cap">' + c.flight + ' · SITZ ' + c.seat + '</div></div>';
    if (c.type === 'cash') return '<div class="holo"><div class="dots"><div class="move"><div class="spin"></div></div></div></div>'
      + '<div class="sheen"><div class="move"></div></div><span class="n">Cash</span><span class="v">' + money(c.balance) + '</span>';
    return '<img' + (c.rot ? ' class="rot"' : '') + ' src="' + esc(c.img) + '" alt="' + esc(c.name) + '"><div class="shine"></div>';
  }

  const stack = document.getElementById('stack');
  const detail = document.getElementById('detail');
  const spacer = document.getElementById('spacer');
  const secPass = document.getElementById('secPass');
  document.getElementById('today').textContent = new Date().toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' });
  let data = [], els = [], selected = null;

  function build() {
    els.forEach(e => e.remove());
    data = allCards();
    els = data.map(c => {
      const el = document.createElement('div');
      el.className = 'card face-' + c.type;
      if (c.type === 'pass') { el.style.setProperty('--pc', c.pc); el.style.setProperty('--pg', c.pg); }
      el.innerHTML = faceHTML(c);
      el.addEventListener('click', () => select(selected === el ? null : el));
      stack.insertBefore(el, detail);
      const sh = el.querySelector('.shine');
      if (sh) bindShine(el, sh);
      return el;
    });
  }

  function layout(animate = true) {
    if (!animate) els.forEach(c => c.style.transition = 'none');
    const h = els[0].offsetHeight;
    const peek = Math.round(h * 0.34);
    // zwei Stapel wie im echten Wallet: oben Karten, darunter die Bordkarten
    const cardEls = els.filter((e, i) => data[i].type !== 'pass');
    const passEls = els.filter((e, i) => data[i].type === 'pass');
    const passStart = (cardEls.length - 1) * peek + h + 56;
    secPass.style.display = passEls.length ? '' : 'none';
    secPass.style.transform = 'translate3d(0,' + (passStart - 26) + 'px,0)';
    const ppeek = 60;  // bei Tickets nur die Kopfzeile zeigen
    const total = passEls.length ? passStart + (passEls.length - 1) * ppeek + h + 60 : (cardEls.length - 1) * peek + h + 60;
    spacer.style.height = total + 'px';
    const st = stack.scrollTop;
    const bottom = st + stack.clientHeight - 64;
    // Ticket offen: es wird lang, alles andere blendet aus und bleibt liegen
    const passOpen = selected && selected.classList.contains('face-pass');
    if (selected) {
      const sh = passOpen ? selected.offsetHeight : h;
      detail.style.top = (st + sh + 20) + 'px';
      detail.style.height = (stack.clientHeight - sh - 20) + 'px';
    }
    els.forEach((c, i) => {
      let y, s = 1, z = i + 1, delay = 0;
      c.classList.toggle('dim', !!passOpen && c !== selected);
      c.classList.toggle('open', !!passOpen && c === selected);
      if (selected === null || (passOpen && c !== selected)) {
        const pi = passEls.indexOf(c);
        y = pi < 0 ? cardEls.indexOf(c) * peek : passStart + pi * ppeek;
        delay = passOpen ? 0 : (els.length - 1 - i) * 30;
      } else if (c === selected) {
        y = st; z = 100;
      } else {
        const rest = els.filter(x => x !== selected).indexOf(c);
        y = bottom + Math.min(rest, 4) * 9;
        s = 0.92 + Math.min(rest, 4) * 0.02;
        delay = Math.min(rest, 6) * 30;
      }
      c.style.zIndex = z;
      c.style.transitionDelay = delay + 'ms';
      c.style.transform = 'translate3d(0,' + y + 'px,0) scale(' + s + ')';
    });
    stack.classList.toggle('sel', selected !== null);
    if (!animate) { void stack.offsetWidth; els.forEach(c => c.style.transition = ''); }
  }

  // Beim offenen Ticket steht alles im Ticket selbst – darunter nur der Fertig-Knopf
  function renderPass() {
    detail.innerHTML = '<div class="actions rise" style="--i:3"><button data-act="back" style="grid-column:1/-1">Fertig</button></div>';
  }

  function renderDetail(c) {
    if (c.type === 'pass') return renderPass(c);
    const inSum = c.tx.filter(t => t.a > 0).reduce((s, t) => s + t.a, 0);
    const outSum = c.tx.filter(t => t.a < 0).reduce((s, t) => s + t.a, 0);
    let h = '<div class="meta rise"><div><span class="label">' + esc(c.name) + (c.num ? ' · ' + c.num : '') + '</span><span class="bal">' + money(c.balance) + '</span></div>'
          + '<div class="side">' + esc(c.side[0]) + '<b>' + esc(c.side[1]) + '</b></div></div>'
          + '<div class="actions rise"><button class="primary" data-act="pay">' + esc(c.action) + '</button><button data-act="back">Fertig</button></div>'
          + '<div class="txh rise"><h3>Transaktionen</h3><span class="label" style="margin:0">Diese Woche</span></div>'
          + '<div class="sum rise"><div><span class="label">Einnahmen</span><b class="in">' + eur(inSum) + '</b></div><div><span class="label">Ausgaben</span><b>' + eur(outSum) + '</b></div></div>'
          + '<div class="tx rise">' + c.tx.map(t =>
        '<div class="row"><span class="ico">' + esc(t.i) + '</span><span class="w"><span>' + esc(t.t) + '</span><small>'
        + esc(t.s) + '</small></span><span class="amt' + (t.a > 0 ? ' in' : '') + '">' + eur(t.a) + '</span></div>').join('') + '</div>';
    if (c.custom) h += '<button class="remove rise" data-act="remove">Karte entfernen</button>';
    detail.innerHTML = h;
    detail.querySelectorAll('.rise').forEach((e, i) => e.style.setProperty('--i', i));
    detail.scrollTop = 0;
  }

  function select(el) {
    selected = el;
    if (el) renderDetail(data[els.indexOf(el)]);
    layout();
  }

  detail.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'back') select(null);
    if (act === 'pay') startPay(selected);
    if (act === 'remove') removeCard(selected);
  });
  addEventListener('resize', () => layout(false));

  function removeCard(el) {
    const c = data[els.indexOf(el)];
    el.classList.add('leaving');
    selected = null;
    layout();
    setTimeout(() => {
      custom = custom.filter(x => x.id !== c.id);
      save();
      build();
      layout(false);
    }, 300);
  }

  // Schimmer folgt dem Finger, weich nachgezogen
  function bindShine(card, sh) {
    let target = 0, cur = 0, raf = 0, out = 0;
    const pos = e => e.clientX - card.getBoundingClientRect().left - sh.offsetWidth / 2;
    const tick = () => {
      cur += (target - cur) * 0.15;
      sh.style.transform = 'translate3d(' + cur.toFixed(1) + 'px,0,0) rotate(20deg)';
      raf = Math.abs(target - cur) > 0.3 ? requestAnimationFrame(tick) : 0;
    };
    card.addEventListener('pointerdown', e => {
      clearTimeout(out);
      cur = target = pos(e);
      sh.classList.add('follow');
      sh.style.opacity = 1;
      tick();
    });
    card.addEventListener('pointermove', e => {
      if (!sh.classList.contains('follow')) return;
      target = pos(e);
      if (!raf) raf = requestAnimationFrame(tick);
    });
    const leave = () => {
      sh.style.opacity = 0;
      out = setTimeout(() => { cancelAnimationFrame(raf); raf = 0; sh.classList.remove('follow'); sh.style.transform = ''; sh.style.opacity = ''; }, 350);
    };
    card.addEventListener('pointerup', leave);
    card.addEventListener('pointercancel', leave);
  }

  // Face ID: einblenden → scannen → Haken → ausblenden
  const pay = document.getElementById('pay');
  const payCard = document.getElementById('payCard');
  let timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  function closePay() {
    timers.forEach(clearTimeout); timers = [];
    pay.classList.remove('on', 'scan');           // Haken bleibt sichtbar, während alles ausblendet
    later(450, () => pay.className = 'pay-layer');
  }
  function startPay(el) {
    timers.forEach(clearTimeout); timers = [];
    const c = data[els.indexOf(el)];
    payCard.className = 'pc face-' + c.type;
    payCard.innerHTML = faceHTML(c).replace('<div class="shine"></div>', '');
    pay.className = 'pay-layer';
    void pay.offsetWidth;
    pay.className = 'pay-layer on';
    later(450, () => pay.className = 'pay-layer on scan');
    later(1750, () => pay.className = 'pay-layer on done');
    later(3700, closePay);
  }
  pay.onclick = closePay;

  // „+“: Bild auswählen → wird zur Karte
  const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
  const pick = document.getElementById('pick'), file = document.getElementById('file');
  const nameIn = document.getElementById('cardName'), err = document.getElementById('err');
  let picked = null;
  function openSheet() {
    picked = null; nameIn.value = ''; err.textContent = ''; file.value = '';
    pick.classList.remove('has'); pick.style.backgroundImage = '';
    sheet.classList.add('on'); sheetBg.classList.add('on');
  }
  function closeSheet() { sheet.classList.remove('on'); sheetBg.classList.remove('on'); nameIn.blur(); }
  document.getElementById('addBtn').onclick = openSheet;
  document.getElementById('cancelAdd').onclick = closeSheet;
  sheetBg.onclick = closeSheet;

  // Bild auf Kartenformat zuschneiden und verkleinern, damit es in den Gerätespeicher passt
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      const W = 856, H = 540, cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const g = cv.getContext('2d');
      // Hochkant-Karten (Schrift läuft von oben nach unten) um 90° nach links drehen, damit sie quer liegen
      const portrait = im.naturalHeight > im.naturalWidth;
      const iw = portrait ? im.naturalHeight : im.naturalWidth, ih = portrait ? im.naturalWidth : im.naturalHeight;
      // Fast kartenförmige Bilder ganz einpassen (Rand bleibt dran), alles andere zuschneiden
      const r = Math.max(W / iw, H / ih);
      const near = (iw / ih) / (W / H) > 0.85 && (iw / ih) / (W / H) < 1.15;
      const sx = near ? W / iw : r, sy = near ? H / ih : r;
      const a = portrait ? sy : sx, b = portrait ? sx : sy;
      g.translate(W / 2, H / 2);
      if (portrait) g.rotate(-Math.PI / 2);
      g.drawImage(im, -im.naturalWidth * a / 2, -im.naturalHeight * b / 2, im.naturalWidth * a, im.naturalHeight * b);
      picked = cv.toDataURL('image/jpeg', 0.82);
      pick.style.backgroundImage = 'url(' + picked + ')';
      pick.classList.add('has');
      err.textContent = '';
      URL.revokeObjectURL(url);
    };
    im.onerror = () => { err.textContent = 'Das Bild lässt sich nicht öffnen. Versuch ein anderes.'; };
    im.src = url;
  };
  nameIn.oninput = () => { err.textContent = ''; };

  document.getElementById('confirmAdd').onclick = () => {
    if (!picked) { err.textContent = 'Wähl zuerst ein Bild aus.'; return; }
    const card = { id:'c' + Date.now(), name:nameIn.value.trim() || 'Meine Karte', img:picked, ...fakeData() };
    custom.push(card);
    if (!save()) { custom.pop(); err.textContent = 'Kein Speicherplatz mehr. Entferne eine Karte und versuch es nochmal.'; return; }
    closeSheet();
    build();
    layout(false);
    setTimeout(() => select(els[data.findIndex(c => c.id === card.id)]), 350);
  };

  // Regenbogen folgt dem Neigen des Handys (oder dem Finger/der Maus)
  const root = document.documentElement;
  const setTilt = (x, y) => { root.style.setProperty('--hx', x.toFixed(1) + 'px'); root.style.setProperty('--hy', y.toFixed(1) + 'px'); };
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    setTilt(clamp(e.gamma, 35) * -2.4, clamp(e.beta - 45, 35) * -2.4);
  });
  addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' || e.buttons) setTilt((e.clientX / innerWidth - .5) * -160, (e.clientY / innerHeight - .5) * -160);
  });
  // iPhone fragt beim ersten Tippen einmal nach Zugriff auf die Bewegungssensoren
  addEventListener('pointerdown', function ask() {
    removeEventListener('pointerdown', ask);
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(() => {});
  });

  build();
  layout(false);

  // App-Icon für den Home-Bildschirm: Bulldogge aus der Karte ausschneiden
  const src = new Image();
  src.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 180;
    const s = src.naturalHeight * 0.66, cx = src.naturalWidth * 0.549, cy = src.naturalHeight * 0.485;
    cv.getContext('2d').drawImage(src, cx - s / 2, cy - s / 2, s, s, 0, 0, 180, 180);
    const url = cv.toDataURL('image/png');
    document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]').forEach(l => l.href = url);
  };
  src.src = 'luna-card.svg';
</script>
</body>
</html>
